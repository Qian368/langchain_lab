[project]
name = "langchain-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "qianyuedu", email = "qianyuedu2@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "langchain>=1.3.18",
    "langchain_core>=1.6",
    "langchain-community>=0.4.2",
    "pathspec>=1.1",
    "prompt-toolkit>=3.0.53",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "huggingface-hub>=1.31.0",
    "faiss-cpu>=1.15.1",
    "pyqt6>=6.11.0",
    "langchain-deepseek>=1.1.0",
    "langchain-zhipuai>=0.0.1",
    "questionary>=2.1.1",
    "pymongo>=4.18.2",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8", "scalar-fastapi>=1.9.1"]

[project.optional-dependencies]
zhipuai = ["langchain-zhipuai"]   # 或 ["langchain-community","zhipuai"]
deepseek = ["langchain-deepseek"]
openai = ["langchain-openai"]
ollama = ["langchain-ollama"]

[project.scripts]
main = "langchain_lab.main:main"
serve_rag = "langchain_lab.rag.api.main_rag:serve"
operation = "langchain_lab.rag.operation.script_1:main"
temp = "langchain_lab.scratch.temp:temp"
temp1 = "langchain_lab.scratch.temp_for_retriever:temp"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# region ====== pytest 配置 ======
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# asyncio_mode = "auto"

# addopts 数组；注意：这里的 -W 依旧无法抑制 import（收集阶段）抛出的警告
# 如需屏蔽 langchain_community import警告：powershell设置环境变量
# $env:PYTHONWARNINGS="ignore::DeprecationWarning:langchain_community"
addopts = ["-W ignore::DeprecationWarning:langchain_community"]

# filterwarnings = ["ignore::PydanticDeprecatedSince20:pydantic"]

# endregion


# region ====== ruff 配置 ======
[tool.ruff]
line-length = 150
target-version = "py313" # 根据你的最小python版本改，py310/py311/py312

[tool.ruff.lint]
# 基础规则集：E错误,W警告,F格式化,I导入排序,UP现代Python,FA, RUF内置
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes 未定义变量、未使用导入等
    "I",   # isort 导入排序（ruff内置，不再需要isort）
    "UP",  # pyupgrade 现代python语法升级 UP0xx
    "FA",  # flake8‑async 异步代码检查
    "RUF", # ruff自己的最佳实践
    "SIM", # flake8‑simplicity 简化冗余代码
    "C4",  # 集合/列表推导式优化
]

# 关闭不需要的规则
ignore = [
    # "ANN001", "ANN201", # 业务项目关闭强制注解；库项目打开
    "RUF001",
    "RUF002",
    "RUF003",
    "E402",
    "D",      # 关闭docstring文档字符串强制，业务代码一般不需要
]

[tool.ruff.lint.per-file-ignores]
# init 文件经常空，放宽
"__init__.py" = ["F401"]     # 允许__init__.py里面故意import导出对外API
"tests/**/*.py" = ["SIM105"] # 测试脚本允许简单冗余

[tool.ruff.format]
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
# 导入分组标准：标准库 / 第三方库 / 本地项目 / 本地相对
known-first-party = ["langchain_lab"] # 包名而非项目名！
split-on-trailing-comma = true

# endregion
