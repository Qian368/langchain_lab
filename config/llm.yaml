# ============ 不测试连通性，配置满足要求即可用 =============
# 实例名自定义
default_instance: zhipuai

instances:
  deepseek:
    provider: deepseek
    model: deepseek-flash
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com/v1
    temperature: 0.7
    max_tokens: 3000

  zhipuai:
    provider: openai
    model: glm-5.2
    api_key: ${ZHIPUAI_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4/
    temperature: 0.7
    max_tokens: 3000

  qwen:
    provider: openai            # 用 OpenAI 兼容协议接通义
    model: qwen-plus
    api_key: ${DASHSCOPE_API_KEY}
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

  local:
    provider: ollama            # 本地模型不需要 api_key
    model: qwen3:8b
    base_url: http://localhost:11434/v1    