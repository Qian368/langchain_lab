# 运行时配置（独立一域一 yaml，由 ConfigLoader 统一加载）
# 上下文压缩执行配置已迁移至 config/context.yaml（context 域）；此处只保留 Agent 运行时行为
runtime:
  agent:
    max_llm_loop: 3        # 单轮对话 LLM 最大迭代次数（原 agent_session.py 硬编码 MAX_LLM_LOOP）
    max_tool_calls: 4      # 单轮对话最大工具调用次数（原 agent_session.py 硬编码 MAX_TOOL_CALLS）
    session_db_path: "./data/sessions.db"   # 会话持久化 SQLite 路径（原 exp9 DEFAULT_DB_PATH）
    default_system_prompt: "你是一个配合测试的助手，按照用户要求执行最小Agent循环任务"  # 原 exp9 DEFAULT_SYSTEM_PROMPT
