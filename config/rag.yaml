# RAG 领域配置
rag:
  api:
    api_base: "http://127.0.0.1:8000"

  mongo:
    # 连接串用 ${VAR} 占位，真实值放 .env（MONGO_USER_URI / MONGO_ADMIN_URI），避免明文入库
    user_uri: "${MONGO_USER_URI}"
    admin_uri: "${MONGO_ADMIN_URI}"
    db_name: "knowledge_base"
    collection: "kb_documents"

  sqlite:
    meta_db_path: "./data/sqlite/meta.db"

  chroma:
    collection: "kb_chunks"
    path: "./data/chroma"

  file:
    upload_dir: "./data/uploads"
    allowed_base_dirs:
      - "D:/notes"

  embedding:
    model: "../models/bge-small-zh-v1.5"
