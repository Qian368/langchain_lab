# RAG 领域配置
rag:
  api:
    api_base: "http://127.0.0.1:8000"

  mongo:
    db_name: "knowledge_base"
    collection: "kb_documents"

  sqlite:
    meta_db_path: "./data/sqlite/meta.db"

  chroma:
    collection: "kb_chunks"
    path: "./data/chroma"

  file:
    upload_dir: "./data/uploads"
    allowed_base_dirs:
      - "D:/notes"